esphome:
  name: reykir-ac

esp8266:
  board: nodemcuv2  # adjust to your board

external_components:
  - source:
      type: local
      path: components

# IMPORTANT: baud rate / parity were not explicitly confirmed from the logs.
# The checksum math (sum-mod-256) matched cleanly assuming plain 8N1, which
# is what the original sniffing setup almost certainly used - keep this as
# 8N1 unless frames start showing checksum mismatches, in which case try
# even parity next.
uart:
  id: ac_uart
  tx_pin: GPIO1
  rx_pin: GPIO3
  baud_rate: 9600

# Disable UART logging or route it elsewhere, same as any other UART-based
# custom AC/appliance component - otherwise ESPHome's own log output will
# get sent down the wire to the AC mainboard and corrupt frames.
logger:
  baud_rate: 0

climate:
  - platform: reykir_ac_climate
    name: "Living Room AC"
    uart_id: ac_uart
    update_interval: 5s
    sleep_mode:
      name: "AC Sleep Mode"
    uvc_light:
      name: "AC UVC Light"
    mute:
      name: "AC Mute"
    display:
      name: "AC Display"
    vane_position:
      name: "AC Vane Position"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:

ota:
  - platform: esphome
